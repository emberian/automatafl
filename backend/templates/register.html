{% extends "base.html" %}

{% block title %}Register - AutomataFL{% endblock %}

{% block content %}
<h2>Register</h2>

{% if let Some(err) = error %}
<div class="error">{{ err }}</div>
{% endif %}

<form method="POST" action="/register">
    <input type="text" name="displayname" placeholder="Username" required autofocus minlength="3">
    <input type="password" name="password" placeholder="Password" required minlength="6">
    <input type="password" name="password_confirm" placeholder="Confirm Password" required minlength="6">
    <button type="submit">Create Account</button>
</form>

<p style="margin-top: 20px;">
    Already have an account? <a href="/login">Login here</a>
</p>
{% endblock %}
