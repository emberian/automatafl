<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutomataFL{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
        }
        header {
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { 
            color: #333;
            font-size: 28px;
        }
        h2 { 
            color: #555; 
            margin: 20px 0 10px;
            font-size: 24px;
        }
        h3 {
            color: #666;
            margin: 15px 0 10px;
            font-size: 18px;
        }
        nav {
            display: flex;
            align-items: center;
        }
        nav a {
            margin-left: 20px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        nav a:hover { 
            text-decoration: underline;
            color: #5568d3;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 400px;
        }
        label {
            font-weight: 500;
            color: #555;
        }
        input, button, select, textarea {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background: #5568d3; }
        .error {
            color: #e74c3c;
            background: #ffebee;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        a.button {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background 0.2s;
        }
        a.button:hover { background: #5568d3; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }
        tr {
            border-bottom: 1px solid #eee;
        }
        code {
            background: #f8f9fa;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        ul {
            margin: 10px 0;
            padding-left: 25px;
        }
        li {
            margin: 5px 0;
            color: #555;
        }
        details {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            margin: 10px 0;
        }
        summary {
            cursor: pointer;
            font-weight: 600;
            user-select: none;
        }
        summary:hover {
            color: #667eea;
        }
        /* Minimal auto-refresh indicator */
        .auto-refresh {
            display: inline-block;
            animation: pulse 2s infinite;
            opacity: 0.7;
            font-size: 12px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="/" style="color: #333; text-decoration: none;">🤖 AutomataFL</a></h1>
            <nav>
                <a href="/">Home</a>
                <a href="/games">Games</a>
                <a href="/leaderboard">Leaderboard</a>
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            </nav>
        </header>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
