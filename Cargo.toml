[workspace]
resolver = "2"
members = ["logic", "webapp", "backend", "backend-client", "api-types"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ember Arlynx <ember@lunar.town>", "Graham Northup <grissess@nexusg.org>"]
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
automatafl-logic = { path = "logic" }
automatafl-api-types = { path = "api-types" }
automatafl-webapp = { path = "webapp" }
automatafl-backend = { path = "backend" }
automatafl-backend-client = { path = "backend-client" }
