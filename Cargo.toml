[workspace]
resolver = "2"
members = ["v8n", "automatafl-lean", "automatafl-ai", "automatafl-server", "automatafl-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ember Arlynx <ember@lunar.town>", "Graham Northup <grissess@nexusg.org>"]
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
automatafl-lean = { path = "automatafl-lean" }
automatafl-ai = { path = "automatafl-ai" }
automatafl-server = { path = "automatafl-server" }
automatafl-client = { path = "automatafl-client" }

[profile.release]
lto = true
strip = true
opt-level = 3
panic = 'abort'
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
