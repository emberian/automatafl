[package]
name = "automatafl-client"
version = "0.1.0"
edition = "2024"
description = "Multi-target TUI and remote client interface for Automatafl (R6)"

[lib]
name = "automatafl_client"
path = "src/lib.rs"

[[bin]]
name = "automatafl-client"
path = "src/bin/automatafl-client.rs"

[dependencies]
automatafl-server = { path = "../automatafl-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
axum = "0.8"
proptest = "1.5"
tempfile = "3"

