[package]
name = "automatafl-backend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "automatafl-client"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
automatafl-logic.workspace = true
automatafl-api-types.workspace = true

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde", "v4"] }
thiserror = "2.0"

# CLI-only dependencies
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }
colored = { version = "3.0", optional = true }
dirs = { version = "6.0", optional = true }

# HTTP client - works on both wasm and native
reqwest = { version = "0.12", features = ["json"] }

# Async runtime - different for wasm vs native
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:anyhow", "dep:colored", "dep:dirs"]
