[package]
name = "automatafl-learner"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "train"
path = "src/bin/train.rs"

[[bin]]
name = "evaluate"
path = "src/bin/evaluate.rs"

[dependencies]
# Core game engine
automatafl-fastlogic = { path = "../fastlogic" }

# Deep learning framework
burn = { version = "0.16", features = ["wgpu", "ndarray"] }
burn-ndarray = "0.16"
burn-wgpu = "0.16"

# Parallelization
rayon = "1.10"
crossbeam-channel = "0.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1", features = [] }
bincode = "1.3"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"

# Math and stats
ndarray = "0.16"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
