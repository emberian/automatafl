[package]
name = "automatafl-webapp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
automatafl-logic = { path = "../logic" }
automatafl-api = { path = "../api-models" }
leptos = { version = "0.8.8", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent",
    "Window", "Storage", "Location", "Document", "Element",
    "HtmlDivElement", "HtmlInputElement", "Event", "EventTarget"
] }
js-sys = "0.3"
gloo-net = "0.6"
gloo-timers = "0.3"
futures = "0.3"
futures-util = "0.3"
futures-channel = "0.3"
uuid = { version = "1.6", features = ["serde", "v4", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }